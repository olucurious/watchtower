<!doctype html>
<!-- The README cover (1280x640, GitHub's social preview size). Render it with
     render-cover.cjs; it embeds ../issue-dark.png and the Geist font from web/. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Geist; src: url('../../../web/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; }
body { margin: 0; }
.cover { position: relative; width: 1280px; height: 640px; overflow: hidden; font-family: Geist; color: #fafafa;
  background: radial-gradient(900px 520px at 0% 0%, rgba(124,58,237,.38), transparent 60%),
              radial-gradient(700px 500px at 100% 100%, rgba(167,139,250,.16), transparent 60%), #09090d; }
.grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 22px 22px;
  mask-image: linear-gradient(90deg, #000 0%, transparent 70%); }
.left { position: absolute; left: 76px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
.brand { display: flex; align-items: center; gap: 16px; }
.mark { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(145deg, #a78bfa, #7c3aed); display: grid; place-items: center;
  box-shadow: 0 10px 40px rgba(124,58,237,.45), inset 0 1px 0 rgba(255,255,255,.25); color: #fff; }
.mark svg { width: 36px; height: 36px; }
h1 { margin: 0; font-size: 64px; font-weight: 650; letter-spacing: -0.035em; }
.tag { margin: 30px 0 0; font-size: 31px; line-height: 1.22; font-weight: 550; letter-spacing: -0.02em; }
.tag span { color: #c4b5fd; }
.sub { margin: 16px 0 0; font-size: 18px; line-height: 1.5; color: #a1a1aa; max-width: 500px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; }
.chip { padding: 6px 12px; border-radius: 999px; font-size: 14px; color: #d4d4d8; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); }
.shot { position: absolute; left: 690px; top: 70px; width: 980px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(124,58,237,.15); transform: perspective(1600px) rotateY(-14deg) rotateX(4deg) rotateZ(1deg); transform-origin: left center; }
.shot img { display: block; width: 100%; }
.fade { position: absolute; inset: 0; background: linear-gradient(90deg, transparent 75%, rgba(9,9,13,.55)); pointer-events: none; }
</style></head><body><div class="cover" id="shot"><div class="grid"></div>
<div class="shot"><img src="../issue-dark.png"></div><div class="fade"></div>
<div class="left">
  <div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2 4 6v3h16V6l-8-4Z" fill="currentColor" opacity=".9"/><path d="M6 10h12l-1.2 12H7.2L6 10Z" fill="currentColor" opacity=".55"/><path d="M10 14h4v8h-4z" fill="currentColor"/></svg></div><h1>Watchtower</h1></div>
  <p class="tag">Self-hosted error tracking.<br><span>Drop-in for Sentry or AppSignal.</span></p>
  <p class="sub">Point the DSN or endpoint at your own server. One Go binary and Postgres, with Slack, Linear, email and an MCP server for coding agents.</p>
  <div class="chips"><span class="chip">Sentry SDKs</span><span class="chip">AppSignal</span><span class="chip">Source maps</span><span class="chip">Slack · Linear</span><span class="chip">MCP</span></div>
</div></div></body></html>
